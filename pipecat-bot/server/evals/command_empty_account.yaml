name: command_empty_account

# Run the bot in one terminal: uv run bot.py -t eval
# Then: uv run pipecat eval run evals/command_empty_account.yaml -v
# This checks the real Pipecat text path: one compiler call for the initial
# intent, zero calls for the registered number, and factual empty-state output.
turns:
  - expect:
      - event: response
        text_contains: "assistant"
  - user: "Mere orders kya kya hain?"
    expect:
      - event: response
        text_contains: "registered mobile"
  - user: "9111111111"
    expect:
      - event: response
        text_contains: "orders"
  - user: "Mujhe apna order cancel karna hai"
    expect:
      - event: response
        text_contains: "orders"
